
services:
  app:
    build: .
    container_name: zzrise-app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped

  pipeline:
    build: .
    container_name: zzrise-pipeline
    command: python -m pipeline.run_pipeline
    env_file:
      - .env
    volumes:
      - .:/app
    profiles:
      - tools
